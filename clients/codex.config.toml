# Append to ~/.codex/config.toml.
#
# Preferred path: use the `vimax` shell CLI authorized via Codex's command
# allowlist (one entry: `vimax`). The MCP transport below is the fallback
# for older Codex builds that can't shell out but can spawn an MCP server.
#
# This bridge runs `vimax_mcp.server --transport stdio` in a fresh
# subprocess. Quota and job registry are NOT shared with the canonical
# launchd-managed daemon — keep stdio bridging out of multi-client jobs.
#
# If your Codex build supports remote MCP, replace this block with:
#   [mcp_servers.vimax]
#   transport = "sse"
#   url = "http://127.0.0.1:7801/mcp/sse"
# (Note the /mcp/ prefix — post-U2 layout. The composite server mounts
# FastMCP under /mcp so REST and SSE coexist on one port.)

[mcp_servers.vimax]
command = "uv"
args = [
  "run",
  "--directory",
  "/Users/zcdeng/projects/vimax-mcp",
  "python",
  "-m",
  "vimax_mcp.server",
  "--transport",
  "stdio",
]
